<script>
(() => {
 let sources;
 async function metadata(){return sources ||= window.FluentSources}
 function dialog(title){const d=document.createElement('dialog');const bar=document.createElement('div');bar.className='dialog-toolbar';const label=document.createElement('span');label.textContent=title;const close=document.createElement('button');close.textContent='Close';close.onclick=()=>d.close();bar.append(label,close);d.append(bar);d.addEventListener('close',()=>d.remove());d.addEventListener('click',e=>{if(e.target===d)d.close()});document.body.append(d);d.showModal();return d}
 window.addEventListener('load',()=>{if(window.MathJax?.startup?.promise)window.MathJax.startup.promise.then(()=>{document.querySelectorAll('[data-equation-image]').forEach(b=>{if(b.querySelector('[data-mjx-error],mjx-merror')){const m=b.querySelector('.math');if(m){const i=document.createElement('img');i.src=b.dataset.equationImage;i.alt='Original equation';i.style.maxWidth='100%';m.replaceWith(i)}}})})});
 const tocLinks=[...document.querySelectorAll('#TOC a[href^="#"]')];
 const tocTargets=tocLinks.map(a=>({a,node:document.getElementById(decodeURIComponent(a.hash.slice(1)))})).filter(x=>x.node);
 let tocFrame=0;
 function updateTOC(){tocFrame=0;if(!tocTargets.length)return;let current=tocTargets[0];for(const entry of tocTargets){const heading=entry.node.matches('h1,h2,h3,h4,h5,h6')?entry.node:entry.node.querySelector('h1,h2,h3,h4,h5,h6')||entry.node;if(heading.getBoundingClientRect().top<=125)current=entry;else break}for(const entry of tocTargets){const selected=entry===current;entry.a.classList.toggle('reader-current',selected);if(selected)entry.a.setAttribute('aria-current','location');else entry.a.removeAttribute('aria-current')}}
 function scheduleTOC(){if(!tocFrame)tocFrame=requestAnimationFrame(updateTOC)}
 window.addEventListener('scroll',scheduleTOC,{passive:true});window.addEventListener('resize',scheduleTOC);window.addEventListener('load',scheduleTOC);tocLinks.forEach(a=>a.addEventListener('click',()=>setTimeout(scheduleTOC,80)));scheduleTOC();
 document.getElementById('toggle-sources').onclick=()=>document.body.classList.toggle('show-sources');
 document.querySelectorAll('.source-button').forEach(b=>b.onclick=async()=>{const s=(await metadata())[b.dataset.block];const d=dialog(`Source · page ${s.page}`);const box=document.createElement('div');box.className='source-page';const im=document.createElement('img');im.src=`pages/${s.page}.jpg`;im.alt=`Original page ${s.page}`;box.append(im);if(s.bbox){const [x,y,r,bottom]=s.bbox;const highlight=document.createElement('div');highlight.className='source-highlight';highlight.style=`left:${x*100}%;top:${y*100}%;width:${(r-x)*100}%;height:${(bottom-y)*100}%`;box.append(highlight)}d.append(box);const a=document.createElement('a');a.href=`source.pdf#page=${s.page}`;a.textContent='Open PDF';d.append(a)});
 document.querySelectorAll('main .paper-block img').forEach(im=>{im.tabIndex=0;im.setAttribute('role','button');im.setAttribute('aria-label','Enlarge figure');const show=()=>{const d=dialog(im.alt||'Figure');const c=im.cloneNode();c.removeAttribute('tabindex');c.style='max-width:85vw;max-height:80vh;object-fit:contain';d.append(c)};im.onclick=show;im.onkeydown=e=>{if(e.key==='Enter')show()}});
 document.getElementById('show-figures').onclick=()=>{const d=dialog('Figures');const grid=document.createElement('div');grid.className='figure-grid';document.querySelectorAll('main .margin-item img').forEach(im=>{const a=document.createElement('a');a.href='#'+im.closest('.paper-block').id;const c=im.cloneNode();a.append(c);a.onclick=()=>d.close();grid.append(a)});d.append(grid)};
})();
</script>
