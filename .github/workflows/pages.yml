name: Validate public sample
on:
  push:
    branches: [main]
    paths: ['demo/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public package
        run: |
          test -f demo/index.html
          test -f demo/ATTRIBUTION.txt
          test -f demo/source.pdf
          test -f demo/sources.js
          test -f demo/vendor/mathjax/tex-chtml.js
          test -z "$(find demo -type l -print -quit)"
          if grep -R -l '/Users/yuuki.fj' demo --include='*.html' --include='*.js'; then exit 1; fi
